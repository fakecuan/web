plugins {
    id 'com.android.application'
}

def vc = (System.getenv("VC") ?: "1") as int

android {
    namespace 'com.fakecuan.editor3mf'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fakecuan.editor3mf'
        minSdk 26
        targetSdk 34
        versionCode vc
        versionName "1." + vc
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.java.srcDirs += '../../android-update-check/java'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
