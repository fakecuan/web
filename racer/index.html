<script>
/* ============ ISI DUA NILAI INI DARI DASHBOARD SUPABASE ============ */
const SUPABASE_URL='https://yngyyoqmftslhcuqmgrn.supabase.co';      // contoh: https://abcdxyz.supabase.co
const SUPABASE_KEY='sb_publishable_kz05d2dAOlpD-hQdcxnCHg_7QVMQm6L';  // Publishable key (sb_publishable_...) atau anon key
const SEND_EVERY_MS=110;                            // makin besar = makin hemat pesan (mis. 160)
/* =================================================================== */
// Adapter: menyediakan API "room" yang sama dengan di claude.ai, tapi lewat Supabase Realtime Broadcast.
// Dipasang hanya jika halaman TIDAK dibuka di dalam claude.ai.
(function(){
 if(window.claude&&window.claude.use)return;
 let sb=null;
 function client(){if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:20}}});return sb}
 const room={async join(name){
  const id=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  const mine={},table=new Map(),subs=new Set();let lastSend=0,timer=null,pend=false,hb=null,closed=false;
  const ch=client().channel('skate:'+name,{config:{broadcast:{self:false,ack:false}}});
  const notify=()=>{if(pend||closed)return;pend=true;setTimeout(()=>{pend=false;if(closed)return;const c={peers:api.peers(),joined:[],left:[],updated:[]};subs.forEach(f=>{try{f(c)}catch(e){}})},120)};
  ch.on('broadcast',{event:'st'},({payload})=>{if(!payload||!payload.id||payload.id===id||typeof payload.p!=='object')return;const now=Date.now(),cur=table.get(payload.id),js=JSON.stringify(payload.p);
   if(!cur||cur.js!==js){table.set(payload.id,{id:payload.id,st:Object.freeze(payload.p),js,upd:now,seen:now});notify()}else cur.seen=now});
  ch.on('broadcast',{event:'bye'},({payload})=>{if(payload&&table.delete(payload.id))notify()});
  await new Promise((res,rej)=>{const t=setTimeout(()=>rej({code:'upstream_error'}),10000);ch.subscribe(st=>{if(st==='SUBSCRIBED'){clearTimeout(t);res()}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){clearTimeout(t);rej({code:'upstream_error'})}})});
  const send=()=>{lastSend=Date.now();timer=null;if(!closed)ch.send({type:'broadcast',event:'st',payload:{id,p:Object.assign({},mine)}})};
  hb=setInterval(()=>{send();const now=Date.now();let ch2=false;for(const [k,v] of table)if(now-v.seen>5000){table.delete(k);ch2=true}if(ch2)notify()},1000);
  const api={
   presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}
    const wait=SEND_EVERY_MS-(Date.now()-lastSend);if(wait<=0)send();else if(!timer)timer=setTimeout(send,wait);notify();return Promise.resolve()},
   peers(){const out=[{peer:id,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:Object.assign({},mine),updatedAt:Date.now()}];
    for(const v of table.values())out.push({peer:v.id,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:v.st,updatedAt:v.upd});return out},
   onPeers(fn){subs.add(fn);return()=>subs.delete(fn)},
   emit(){return Promise.resolve()},on(){return()=>{}},connected(){return !closed},onConnection(fn){fn(true);return()=>{}},
   async leave(){if(closed)return;try{await ch.send({type:'broadcast',event:'bye',payload:{id}})}catch(e){}closed=true;clearInterval(hb);if(timer)clearTimeout(timer);try{client().removeChannel(ch)}catch(e){}}
  };
  window.addEventListener('pagehide',()=>{api.leave()});
  api.presence({});return api}};
 window.claude={use:async n=>{if(n!=='room')return null;if(!window.supabase||/^GANTI_/.test(SUPABASE_URL)||/^GANTI_/.test(SUPABASE_KEY))return null;return room}};
})();
</script>

let W=0,H=0,dpr=1,state='menu',racers=[],player=null,elapsed=0,countdown=0,lastFrame=0,steer=0,steerValue=0,lapNow=0,toast='',toastUntil=0,eliminations=0,finishOrder=[],raceStartS=0;
const raceSpecs={'300':{label:'300 METER',count:6,meters:300,laps:300/LAP_METERS,elim:false},'500':{label:'500 METER',count:6,meters:500,laps:500/LAP_METERS,elim:false},'1000':{label:'1.000 METER',count:8,meters:1000,laps:1000/LAP_METERS,elim:false},'elim':{label:'ELIMINATION 2,5 KM',count:18,meters:2500,laps:2500/LAP_METERS,elim:true}};
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const mr=mapCanvas.getBoundingClientRect();mapCanvas.width=Math.round(mr.width*dpr);mapCanvas.height=Math.round(mr.height*dpr);mapCtx.setTransform(dpr,0,0,dpr,0,0);draw()}
new ResizeObserver(resize).observe(canvas);
function trackPos(s,d=0){const {straight:L,radius:R,arc:A,perimeter:P}=TRACK;s=((s%P)+P)%P;let x,y,h,arc=false,a;if(s<L){x=-L/2+s;y=R+d;h=0}else if(s<L+A){arc=true;a=Math.PI/2-(s-L)/R;x=L/2+(R+d)*Math.cos(a);y=(R+d)*Math.sin(a);h=a-Math.PI/2}else if(s<2*L+A){let u=s-L-A;x=L/2-u;y=-(R+d);h=Math.PI}else{arc=true;a=-Math.PI/2-(s-2*L-A)/R;x=-L/2+(R+d)*Math.cos(a);y=(R+d)*Math.sin(a);h=a-Math.PI/2}return{x,y,h,arc}}
function spec(){return raceSpecs[cfg.race]}
function startGrid(count,baseS){if(count===18){const lanes=[-53.75,-32.25,-10.75,10.75,32.25,53.75];return Array.from({length:18},(_,i)=>{const row=Math.floor(i/6),lane=i%6;return{s:baseS-row*34,d:lanes[lane],row:row+1}})}const front=count===8?4:3,back=count-front,ds=[];for(let i=0;i<front;i++)ds.push((i-(front-1)/2)*29);for(let i=0;i<back;i++)ds.push((i-(back-1)/2)*29);return Array.from({length:count},(_,i)=>({s:baseS-(i<front?0:38),d:ds[i],row:i<front?1:2}))}
function initRace(){const sp=spec();const blueStart=TRACK.straight+TRACK.arc+TRACK.straight*0.65;const yellowStart=blueStart-TRACK.perimeter/2;raceStartS=(cfg.race==='300'||cfg.race==='500')?yellowStart:blueStart;const grid=startGrid(sp.count,raceStartS);racers=Array.from({length:sp.count},(_,i)=>({id:i,name:i===0?(cfg.playerName.trim()||'Kamu'):NAMES[i],color:COLORS[i],s:grid[i].s,d:grid[i].d,v:0,top:MAX_SPEED,alive:true,finished:false,fall:0,fallTime:0,imm:0,crashCooldown:0,phase:Math.random()*6,ai:i!==0,row:grid[i].row,finishTime:null,eliminatedAt:null,skill:.91+Math.random()*.09,stamina:1}));player=racers[0];racers.forEach((r,i)=>{if(i>0)r.skill=.99+((i*7)%2)*.01});elapsed=0;countdown=3.9;steer=0;steerValue=0;updateSteerUI();lapNow=0;eliminations=0;finishOrder=[];toast='';state='count';renderLeaderboard();$('overlay').style.display='none';}
function escapeHTML(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function menu(){navSeq++;leaveOnline();state='menu';$('dialog').dataset.olhtml='';$('overlay').style.display='flex';const locked=!!acct;
$('dialog').innerHTML=`<h1>🛼 Inline Skate Race</h1><p>Pilih nomor balapan. Semua lawan menggunakan kemampuan AI paling sulit dan memiliki top speed yang sama.</p><div class="sub">NAMA PEMAIN (WAJIB DIISI)</div><input id="playerNameInput" class="playerNameInput" maxlength="16" autocomplete="off" placeholder="Isi nama pemain" value="${escapeHTML(cfg.playerName)}" ${locked?'readonly':''}>${locked?'<div class="mini">Memakai nama akun online. Keluar akun untuk mengganti.</div>':''}<div id="nameErr"></div><div class="sub">PILIH JARAK BALAP • 1 PUTARAN = 200 METER</div><div class="choices">${Object.entries(raceSpecs).map(([k,v])=>`<button class="choice ${cfg.race===k?'sel':''}" data-race="${k}">${v.label}<br><small>${v.count} PEMBALAP • ${v.laps} LAP</small></button>`).join('')}</div><div class="legend"><b>Level lawan: PALING SULIT</b><br>Kontrol: Tap berulang untuk akselerasi dari 0, tetapi setiap tap menguras ENERGI. Saat sudah mendekati top speed, berhenti tap agar skater meluncur dan hemat energi; tap lagi hanya untuk menambah kecepatan. Energi kuning = top speed 70%, merah = 50%. Energi pulih saat kamu tidak tap. Lawan komputer memakai aturan energi yang sama. Gunakan slider KIRI–TENGAH–KANAN untuk mengarahkan skater. Mode Elimination 2,5 km: 18 pembalap start dalam 3 baris (6 per baris). Setiap lap, 3 pembalap terbawah tereliminasi sampai tersisa 3.</div><button class="primary" id="start">MULAI BALAP</button><button class="secondary" id="online">🌐 MAIN ONLINE (HP vs HP)</button>`;
const inp=$('playerNameInput');inp.addEventListener('input',e=>{cfg.playerName=e.target.value});
$('dialog').querySelectorAll('[data-race]').forEach(b=>b.onclick=()=>{cfg.playerName=inp.value;cfg.race=b.dataset.race;menu()});
$('start').onclick=()=>{const n=cleanTxt(inp.value,16);if(!n){$('nameErr').innerHTML='<div class="err">⚠ Nama pemain wajib diisi sebelum bermain.</div>';inp.focus();return}cfg.playerName=n;lsSet('skate_name',n);audioReady();initRace()};
$('online').onclick=()=>{if(!locked)cfg.playerName=inp.value;audioReady();onlineMenu()};}
$('menuBtn').addEventListener('click',()=>{audioReady();steer=0;steerValue=0;updateSteerUI();menu()});
function formatTime(s){let m=Math.floor(s/60),sec=(s%60).toFixed(2).padStart(5,'0');return m+':'+sec}
function currentLap(r){return Math.min(spec().laps,Math.floor(Math.max(0,r.s-raceStartS)/TRACK.perimeter)+1)}

 if(host)action=`<label class="chk"><input type="checkbox" id="lFill" ${fill?'checked':''}> Isi slot kosong dengan komputer (sampai ${max} pemain)</label><button class="primary" id="lStart" ${canStart?'':'disabled style="opacity:.5"'}>MULAI BALAP • ${humans.length} pemain${bots?' + '+bots+' komputer':''}</button>${waiting>0?`<div class="mini" style="margin-top:6px">${waiting} pemain berstatus BELUM tidak akan ikut balapan ini.</div>`:''}`;
 else action=`<button class="primary" id="lReady" ${idle?'':'disabled style="opacity:.5"'}>${!idle?'BALAPAN BERLANGSUNG...':(olMyReady?'BATAL SIAP':'SIAP!')}</button><div class="mini" style="margin-top:6px">Menunggu 👑 host memulai balapan.</div>`;
 olDialog(`<h1>${m.pwh?'🔒 ':''}${escapeHTML(m.nm)}</h1><p>Kode room: <b>${olCode.toUpperCase()}</b> • ${m.pwh?'Private':'Publik'}. Ketuk nama pemain untuk melihat profil & statistik.</p><div class="sub">PEMAIN (${ps.length}/${max})</div>${rows}<div class="sub">JARAK BALAP ${host?'(kamu 👑 yang memilih)':'(dipilih 👑 host)'}</div><div class="choices" style="grid-template-columns:repeat(4,1fr)">${fmt}</div>${action}<button class="secondary" id="lLeave">KELUAR ROOM</button>`,force);
 $('dialog').querySelectorAll('[data-pf]').forEach(d=>d.onclick=()=>showProfile(d.dataset.pf));
 $('dialog').querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{if(!host)return;olMeta=Object.assign({},olMeta,{rc:b.dataset.rc});olRoom.presence({m:olMeta});olSync();renderLobby()});
 const f=$('lFill');if(f)f.onchange=()=>{olMeta=Object.assign({},olMeta,{fill:f.checked});olRoom.presence({m:olMeta});renderLobby()};
 bind('lStart',()=>{audioReady();hostStart()});
 bind('lReady',()=>{audioReady();olMyReady=!olMyReady;olRoom.presence({rd:olMyReady});renderLobby()});
 bind('lLeave',()=>roomListScreen())}
async function showProfile(name){
 olView='profile';olDialog(`<h1>Profil</h1><p>Memuat...</p>`,true);
 profCache.delete(String(name).toLowerCase());await ensureProfiles([name]);
 if(olView!=='profile'||state!=='lobby')return;const p=profOf(name)||{name,avatar:'',club:'',location:'',stats:{}};
 olDialog(`<div class="card" style="flex-direction:column;text-align:center">${avHTML(p.avatar,92,p.name)}<b style="font-size:20px">${escapeHTML(p.name)}</b><div class="mini">${infoLine(p)}</div></div>${statsHTML(p)}<button class="secondary" id="pBack">⬅ KEMBALI KE ROOM</button>`,true);
 bind('pBack',()=>{olView='lobby';renderLobby(true)})}

/* ---------- mulai & jalannya balapan online ---------- */
function hostStart(){
 if(!olRoom||!iAmHost()||!olMeta)return;const ps=olViewers(),max=OL_MAX[olMeta.rc];
 const humans=ps.filter(p=>p.sameTab||(p.presence.rd===true&&p.presence.ph==='lobby')).slice(0,max),total=olMeta.fill!==false?max:humans.length;if(total<2)return;
 const go={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),rc:olMeta.rc,parts:humans.map(p=>[p.peer,olNameOf(p)]),bots:total-humans.length};
 olLastGo=go.id;olRoom.presence({go,ph:'race',b:null,eo:null,fn:null});startOnlineRace(go)}
function olGrid(n,rc,baseS){
 if(rc==='elim'){const lanes=[-53.75,-32.25,-10.75,10.75,32.25,53.75];return Array.from({length:n},(_,i)=>({s:baseS-Math.floor(i/6)*34,d:lanes[i%6],row:Math.floor(i/6)+1}))}
 const front=n>=8?4:Math.min(3,n),back=n-front,ds=[];for(let i=0;i<front;i++)ds.push((i-(front-1)/2)*29);for(let i=0;i<back;i++)ds.push((i-(back-1)/2)*29);
 return Array.from({length:n},(_,i)=>({s:baseS-(i<front?0:38),d:ds[i],row:i<front?1:2}))}
function startOnlineRace(go){
 cfg.race=go.rc;const me=myPeer(),hostNow=iAmHost();
 const blueStart=TRACK.straight+TRACK.arc+TRACK.straight*0.65,yellowStart=blueStart-TRACK.perimeter/2;
 raceStartS=(go.rc==='300'||go.rc==='500')?yellowStart:blueStart;
 const n=go.parts.length+go.bots,grid=olGrid(n,go.rc,raceStartS);racers=[];
 const mk=(i,name,extra)=>Object.assign({id:i,name,color:COLORS[i%COLORS.length],s:grid[i].s,d:grid[i].d,v:0,top:MAX_SPEED,alive:true,finished:false,fall:0,fallTime:0,imm:0,crashCooldown:0,phase:Math.random()*6,ai:false,row:grid[i].row,finishTime:null,eliminatedAt:null,skill:1,stamina:1},extra);
 go.parts.forEach(([peer,name],i)=>racers.push(mk(i,name,{remote:peer!==me,peer})));
 for(let k=0;k<go.bots;k++){const i=go.parts.length+k;racers.push(mk(i,(NAMES[1+k]||'CPU')+' (PC)',{bot:true,bi:k,ai:true,remote:!hostNow,skill:.99+((i*7)%2)*.01}))}
 player=racers.find(r=>!r.bot&&!r.remote);
 elapsed=0;countdown=3.9;steer=0;steerValue=0;updateSteerUI();lapNow=0;eliminations=0;finishOrder=[];toast='';state='count';olLastHTML='';olElims=[];olRecPending=false;olRecState='';olView='lobby';$('dialog').dataset.olhtml='';
 renderLeaderboard();$('overlay').style.display='none';audioReady();
 olRoom.presence({ph:'race',s:+player.s.toFixed(1),d:+player.d.toFixed(1),v:0,f:0,fn:null})}
function onlineTick(now){
 if(!online||!olRoom)return;
 if(now-olSyncAt>400){olSyncAt=now;olSync()}
 if(state==='lobby'){const ps=olViewers(),h=olHostP(ps),g=h&&h.presence.go;
  if(g&&g.id!==olLastGo){olLastGo=g.id;const me=myPeer();if(!h.sameTab&&h.presence.ph==='race'&&Array.isArray(g.parts)&&g.parts.some(x=>x[0]===me)&&olView==='lobby')startOnlineRace(g)}return}
 if((state==='count'||state==='race'||state==='done')&&player&&now-olLastSend>70){olLastSend=now;const patch={};
  if(state!=='done'){patch.s=+player.s.toFixed(1);patch.d=+player.d.toFixed(1);patch.v=Math.round(player.v);patch.f=player.fall>0?1:0}
  if(racers.some(r=>r.bot)&&iAmHost()){patch.b=racers.filter(r=>r.bot).map(r=>[+r.s.toFixed(1),+r.d.toFixed(1),Math.round(r.v),r.fall>0?1:0,r.finished&&r.finishTime?+r.finishTime.toFixed(2):0]);patch.eo=olElims.length?olElims:null}
  if(Object.keys(patch).length)olRoom.presence(patch)}}
function applyRemote(r,s,d,v,f,upd,dt){const age=Math.min(.35,Math.max(0,(Date.now()-upd)/1000)),ts=s+(f?0:v*age),k=Math.min(1,12*dt);r.s+=(ts-r.s)*k;r.d+=(d-r.d)*k;r.v=v;r.fall=f?1:0;r.phase+=v*dt*.055}
function applyElims(eo){let ch=false;for(const e of eo){const r=racers[e[0]];if(r&&r.alive&&!r.finished){r.alive=false;r.eliminatedAt=e[1];eliminations=Math.max(eliminations,e[1]);ch=true}}if(ch){setToast('ELIMINATION','PEMBALAP TERAKHIR KELUAR');sfx('elim');renderLeaderboard()}}
function syncRemotes(dt){
 if(!olRoom)return;const ps=olRoom.peers(),h=olHostP(olViewers()),meHost=!!(h&&h.sameTab),hp=h?h.presence:null;
 for(const r of racers){
  if(r.bot){r.remote=!meHost;if(meHost||!h)continue;const b=hp.b&&hp.b[r.bi];if(!b)continue;applyRemote(r,b[0],b[1],b[2],b[3],h.updatedAt,dt);if(b[4]&&!r.finished){r.finished=true;r.finishTime=b[4]}continue}
  if(!r.remote)continue;
  const pe=ps.find(p=>p.peer===r.peer);
  if(!pe){if(!r.finished&&r.alive)r.alive=false;continue}
  const q=pe.presence;
  if(typeof q.s==='number'&&typeof q.d==='number')applyRemote(r,q.s,q.d,typeof q.v==='number'?q.v:0,q.f,pe.updatedAt,dt);
  if(typeof q.fn==='number'&&!r.finished){r.finished=true;r.finishTime=q.fn}}
 if(!meHost&&hp&&Array.isArray(hp.eo))applyElims(hp.eo)}
function ranking(){return racers.slice().sort((a,b)=>{if(a.finished&&b.finished)return a.finishTime-b.finishTime;if(a.finished)return -1;if(b.finished)return 1;if(a.alive!==b.alive)return a.alive?-1:1;if(!a.alive&&!b.alive)return(b.eliminatedAt||0)-(a.eliminatedAt||0)||b.s-a.s;return b.s-a.s})}
function olRecordNow(){
 if(!olRecPending||!acct||!player)return;olRecPending=false;const place=ranking().indexOf(player)+1,race=cfg.race;olRecState='saving';
 rpc('skate_record',{p_name:acct.name,p_token:acct.token,p_race:race,p_place:place}).then(r=>{if(r&&r.ok&&r.profile&&acct){acct.profile=normProfile(r.profile);profCache.set(acct.name.toLowerCase(),acct.profile);olRecState='ok'}else olRecState='fail';if(state==='done'&&online)showOnlineResults()})}
function onlineFinish(won){
 state='done';steer=0;if(won)sfx('finish');olFinAt=Date.now();olRecPending=true;olRecState='';
 if(olRoom)olRoom.presence({ph:'fin',fn:won&&player.finishTime?+player.finishTime.toFixed(2):null,f:0,v:0,s:+player.s.toFixed(1),d:+player.d.toFixed(1)});
 olLastHTML='';showOnlineResults();if(olRes)clearInterval(olRes);olRes=setInterval(showOnlineResults,600)}
function showOnlineResults(){
 if(state!=='done'||!online){if(olRes){clearInterval(olRes);olRes=null}return}
 const rk=ranking(),done=rk.every(r=>r.finished||!r.alive),won=player.finished;
 if(olRecPending&&(!player.alive||done||Date.now()-olFinAt>25000))olRecordNow();
 const rec=olRecState==='ok'?'<div class="mini" style="margin-top:8px">📊 Statistik akunmu sudah diperbarui.</div>':(olRecState==='fail'?'<div class="mini" style="margin-top:8px">Statistik gagal disimpan (koneksi).</div>':'');
 const html=`<h1>${won?'🏁 FINISH!':'💥 TERELIMINASI'}</h1><p>${done?'Semua pembalap sudah selesai.':'Menunggu pembalap lain menyelesaikan balapan...'}</p><div class="sub">HASIL • ${escapeHTML(spec().label)}</div>${rk.map((r,i)=>`<div class="rowItem" style="${r===player?'background:#ffe9e2':''}"><b style="width:26px">#${i+1}</b><span style="width:12px;height:12px;border-radius:50%;background:${r.color};flex:none"></span><b style="flex:1;font-size:13px;min-width:0">${escapeHTML(r.name)}${r===player?' (kamu)':''}</b><span style="font-size:12px;font-variant-numeric:tabular-nums">${r.finished?formatTime(r.finishTime):(r.alive?Math.floor(meters(r))+' m':'keluar')}</span></div>`).join('')}${rec}<button class="primary" id="olLobby">KEMBALI KE LOBI</button><button class="secondary" id="olExit">KELUAR ROOM</button>`;
 if(html!==olLastHTML){olLastHTML=html;olDialog(html,true);bind('olLobby',backToLobby);bind('olExit',()=>roomListScreen())}}
function backToLobby(){
 if(olRes){clearInterval(olRes);olRes=null}
 if(!olRoom){roomListScreen();return}
 olRecordNow();olMyReady=false;olLastHTML='';state='lobby';olView='lobby';
 const patch={ph:'lobby',rd:false,fn:null,s:null,d:null,v:null,f:null};if(iAmHost()){patch.go=null;patch.b=null;patch.eo=null}
 olRoom.presence(patch);olSync();renderLobby(true)}
function olDialog(html,force){const d=$('dialog');if(!force&&d.dataset.olhtml===html&&$('overlay').style.display==='flex')return;d.dataset.olhtml=html;$('overlay').style.display='flex';d.innerHTML=html}

{const s0=loadSession();cfg.playerName=lsGet('skate_name')||(s0&&s0.name)||''}
menu();resize();requestAnimationFrame(frame);window.addEventListener('resize',()=>{resize();updateSteerUI()});
