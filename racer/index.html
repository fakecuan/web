<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Inline Skate Race Online</title>
<style>
:root{--bg:#111923;--panel:#1c2938;--text:#f4f7fb;--muted:#aab7c7;--accent:#ff633e}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}#app{height:100dvh;min-height:480px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% -10%,#33465a,#111923 70%)}
#top{padding:8px 10px 6px;flex:none;background:#101923;border-bottom:1px solid #ffffff18}#brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#brand strong{font-size:14px;letter-spacing:1.2px}#menuBtn{font-size:11px;color:#fff;font-weight:900;background:#53677f;border:1px solid #ffffff30;border-radius:9px;padding:7px 11px;letter-spacing:.4px}#menuBtn:active{filter:brightness(1.2);transform:translateY(1px)}#leaderboard{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 1px 5px}#leaderboard::-webkit-scrollbar{display:none}.racer{flex:0 0 auto;min-width:68px;padding:5px 7px 4px;border-radius:9px;background:#263547;border:1px solid #ffffff15;position:relative}.racer.me{background:#56372f;border:1px solid #ff8a66}.racer.out{opacity:.35;filter:grayscale(1)}.racer .name{font-size:10px;font-weight:900;white-space:nowrap}.racer .gap{font-size:10px;color:#c5d0dc;font-weight:700;font-variant-numeric:tabular-nums}.racer .rank{position:absolute;right:5px;top:4px;font-size:9px;color:#aab7c7}
#stage{position:relative;flex:1;min-height:160px;overflow:hidden}canvas{width:100%;height:100%;display:block}#centerHud{position:absolute;left:10px;top:9px;display:flex;gap:6px;pointer-events:none}.pill{background:#111923d9;border:1px solid #ffffff20;border-radius:10px;padding:5px 9px;box-shadow:0 3px 10px #0004}.pill small{display:block;color:#aab7c7;font-size:9px;font-weight:800;letter-spacing:.7px}.pill b{font-size:15px;font-variant-numeric:tabular-nums}#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(25px,7vw,48px);font-weight:1000;text-shadow:0 3px 8px #000;white-space:nowrap;pointer-events:none;text-align:center}#toast small{display:block;font-size:13px;letter-spacing:1px}#minimap{position:absolute;right:9px;top:9px;width:126px;height:94px;border:0;border-radius:8px;background:transparent;box-shadow:none;pointer-events:none;overflow:hidden}#minimap canvas{width:100%;height:100%;display:block}
#controls{display:none;flex:none;background:#172331;border-top:1px solid #ffffff20;padding:5px 8px calc(5px + env(safe-area-inset-bottom));grid-template-columns:minmax(95px,1fr) minmax(105px,1.15fr);gap:8px;align-items:center;min-height:0}.steerBox{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}.steerTitle{font-size:10px;color:#aab7c7;font-weight:900;text-align:center;letter-spacing:.7px}#steerPad{width:100%;height:44px;border-radius:14px;background:linear-gradient(90deg,#357ee9,#344558 48%,#344558 52%,#357ee9);position:relative;touch-action:none;border:1px solid #ffffff25}#steerThumb{position:absolute;top:4px;left:calc(50% - 18px);width:36px;height:34px;border-radius:11px;background:#4288ff;box-shadow:0 3px 0 #173d82;pointer-events:none}#steerLabels{display:flex;justify-content:space-between;font-size:9px;color:#aab7c7;font-weight:800}.tapWrap{display:flex;flex-direction:column;gap:5px}.tap{width:100%;height:58px;border-radius:14px;background:linear-gradient(145deg,#ff784e,#e54836);font-size:20px;box-shadow:0 4px 0 #8e3026;min-height:52px}.tap small{display:block;font-size:9px;letter-spacing:.7px}button{border:0;color:white;font-weight:900;cursor:pointer;touch-action:none}button:active,button.down{transform:translateY(2px);filter:brightness(1.2)}
#app.playing #controls{display:grid}
#audioDock{position:absolute;z-index:20;right:8px;top:55%;transform:translateY(-10%);display:none;flex-direction:column;align-items:center;gap:7px;padding:8px 7px;background:#101923e8;border:1px solid #ffffff24;border-radius:14px;box-shadow:0 5px 18px #0006}
#app.main-menu #audioDock{display:flex}
#audioDock .audioIcons{display:flex;flex-direction:row;gap:6px}
#audioDock button{width:36px;height:34px;border-radius:9px;background:#35485e;font-size:17px;line-height:1;padding:0;border:1px solid #ffffff24}
#audioDock button.off{opacity:.42;filter:grayscale(1)}
#audioDock input{width:18px;height:92px;margin:0;accent-color:#35c5ff;writing-mode:vertical-lr;direction:rtl;cursor:pointer}
#audioDock .volCol{display:flex;flex-direction:column;align-items:center;gap:3px}
#audioDock .volVal{font-size:9px;font-weight:900;color:#d8e5f3;min-width:25px;text-align:center}
#overlay{position:absolute;inset:0;z-index:10;background:#07101bdc;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}#dialog{background:#f7f8fb;color:#182433;width:min(440px,100%);max-height:100%;overflow:auto;border-radius:20px;padding:19px;box-shadow:0 15px 50px #0008}#dialog h1{font-size:24px;margin:0 0 5px}#dialog p{font-size:13px;line-height:1.45;color:#536171;margin:5px 0 12px}#dialog .sub{font-weight:900;color:#25374a;margin:13px 0 7px;font-size:12px;letter-spacing:.8px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.choice{padding:11px 7px;border-radius:11px;background:#dce3eb;color:#27374a;font-size:13px;border:2px solid transparent}.choice.sel{background:#e4efff;border-color:#3479df;color:#164b9c}.playerNameInput{width:100%;border:1px solid #c7d0da;border-radius:10px;padding:11px 12px;font:700 14px system-ui;color:#243447;background:#fff;outline:none}.playerNameInput:focus{border-color:#3479df;box-shadow:0 0 0 3px #3479df22}.primary{width:100%;margin-top:15px;background:#f05a3c;border-radius:12px;padding:14px;font-size:16px}.secondary{width:100%;margin-top:7px;background:#53677f;border-radius:12px;padding:11px;font-size:13px}.legend{font-size:11px;color:#667586;line-height:1.5;margin-top:10px}
@media(max-height:620px){#top{padding:4px 8px 2px}#brand{margin-bottom:2px}.racer{padding:3px 6px;min-width:60px}#controls{padding-top:3px;gap:5px}#steerPad{height:38px}#steerThumb{height:29px;top:3px}.tap{height:50px}}
.card{display:flex;gap:10px;align-items:center;background:#eef2f7;border-radius:14px;padding:10px;margin-bottom:6px}.av{flex:none;border-radius:50%;background:#cfd9e6;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;font-weight:900;color:#27374a}.av img{width:100%;height:100%;object-fit:cover}.mini{font-size:11px;color:#667586;line-height:1.4}
.err{background:#ffe3df;color:#a5321f;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:800;margin-top:9px}.tabs{display:flex;gap:6px}.tab{flex:1;padding:10px;border-radius:10px;background:#dce3eb;color:#27374a;font-size:13px}.tab.sel{background:#3479df;color:#fff}
.rowItem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;background:#eef2f7;margin-bottom:5px}.btnS{padding:9px 12px;border-radius:9px;background:#3479df;font-size:12px;flex:none}
.statTop{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.statTop div{background:#e4efff;border-radius:10px;text-align:center;padding:7px 2px}.statTop b{display:block;font-size:18px;color:#164b9c}.statTop small{font-size:9px;font-weight:800;color:#536171;letter-spacing:.5px}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}.statGrid div{background:#f0f3f7;border-radius:10px;padding:7px 9px;font-size:11px;color:#536171}.statGrid b{color:#25374a;font-size:12px;display:block}
.emoGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.emo{font-size:22px;background:#dce3eb;border-radius:10px;padding:6px 0}.chk{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;color:#25374a;margin-top:12px}.chk input{width:18px;height:18px}
button[disabled]{cursor:not-allowed}
#speedBox{position:absolute;right:10px;bottom:10px;pointer-events:none;background:#111923d9;border:1px solid #ffffff20;border-radius:12px;padding:6px 12px 5px;text-align:right;box-shadow:0 3px 10px #0004}#speedBox small{display:block;color:#aab7c7;font-size:9px;font-weight:800;letter-spacing:.7px}#speedBox b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}#speedBox span{font-size:11px;color:#aab7c7;font-weight:800;margin-left:3px}#energy{position:absolute;left:10px;top:62px;width:150px;pointer-events:none;background:#111923d9;border:1px solid #ffffff20;border-radius:10px;padding:5px 8px 6px;box-shadow:0 3px 10px #0004}#energy small{display:flex;justify-content:space-between;color:#aab7c7;font-size:9px;font-weight:800;letter-spacing:.7px;margin-bottom:4px}#energy small b{font-size:10px}#energyTrack{position:relative;height:9px;border-radius:5px;background:#2b3a4c;overflow:hidden}#energyBar{height:100%;width:100%;border-radius:5px;background:#2ecc71;transition:background .2s}#energyTrack i{position:absolute;top:0;bottom:0;width:2px;background:#111923}
#dialog input{user-select:text;-webkit-user-select:text}

.menuHelp{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.helpDrop{border:1px solid #cbd5e1;border-radius:10px;background:#eef2f7;overflow:hidden}
.helpDrop summary{list-style:none;cursor:pointer;padding:10px 11px;color:#25374a;font-size:12px;font-weight:1000;letter-spacing:.7px;display:flex;align-items:center;justify-content:space-between}
.helpDrop summary::-webkit-details-marker{display:none}
.helpDrop summary:after{content:'＋';font-size:15px;color:#3479df;font-weight:1000}
.helpDrop[open] summary:after{content:'−'}
.helpBody{padding:0 11px 11px;color:#536171;font-size:11px;line-height:1.45}
@media(max-width:360px){.menuHelp{grid-template-columns:1fr}}

#brand .brandTitle{display:flex;align-items:center;gap:10px;min-width:0}

#brandLogo{width:66px;height:42px;object-fit:contain}
.menuBrand{display:flex;align-items:center;gap:12px}
.menuBrand img{width:76px;height:52px;object-fit:contain;flex:none}

.statTop{gap:6px;margin:7px 0}

.socialRow input,.socialPanel textarea{min-width:0;flex:1}
.socialItem{background:#fff;border-radius:10px;padding:8px;margin:6px 0;font-size:13px}
.socialItem img{width:auto;max-width:120px;max-height:120px;object-fit:contain;background:transparent;border-radius:7px;display:block;margin:6px auto 0}

.statsDetails{margin:7px 0;background:#f0f3f7;border-radius:12px;padding:8px 10px}

.statsDetails>summary::-webkit-details-marker{display:none}
.statsDetails>summary:after{content:'＋';float:right;font-weight:900}
.statsDetails[open]>summary:after{content:'－'}
.statsDetails .statTop{margin-top:8px}

#headerActions{display:flex;align-items:center;gap:7px}
#accountChip{display:flex;align-items:center;gap:6px;max-width:145px;padding:4px 8px 4px 5px;border:1px solid #ffffff28;border-radius:22px;background:#263547;color:#fff;font-size:11px;font-weight:900;cursor:pointer;min-height:38px}
#accountChip .av{width:28px!important;height:28px!important;min-width:28px;flex:none;font-size:13px!important}
#accountChip .chipName{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#accountChip img{width:100%;height:100%;object-fit:cover;border-radius:50%}
@media(max-width:520px){#accountChip{max-width:105px;gap:4px;padding-right:6px}#accountChip .chipName{max-width:58px}#menuBtn{padding:7px 8px}}

#headerActions{display:flex;align-items:center;gap:8px}
#accountChip{position:relative}
#notifChip{position:relative;border:0;border-radius:50%;width:34px;height:34px;background:#fff;color:#18202b;font-size:19px;cursor:pointer;box-shadow:0 1px 5px #0002}
#notifBadge{position:absolute;right:-4px;top:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:12px;background:#e11d48;color:white;font:bold 10px/17px Arial;text-align:center;border:2px solid white}
.onlineFriendBtn{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid #e5e9ef;border-radius:12px;background:#fff;color:#17202b;margin:6px 0}

#rBack{display:block;width:min(280px,90%);margin:18px auto 2px}
#rOut{display:block;width:min(280px,90%);margin:10px auto}
#notificationModal .notifRow{padding:10px;border-bottom:1px solid #edf0f4;cursor:pointer;text-align:left}

.presenceDot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid #fff;margin-left:2px;box-shadow:0 0 0 1px #0002;vertical-align:middle}
.presenceDot.online{background:#16a34a}.presenceDot.away{background:#eab308}.presenceDot.offline{background:#dc2626}
.presenceChoice{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.presenceChoice button{border:1px solid #dce2e9;border-radius:20px;padding:7px 12px;background:#fff;color:#202936;font-weight:700}
.presenceChoice button.active{outline:2px solid #2563eb;background:#eff6ff}

#dialog:empty{min-height:0;padding:0}
#overlay{align-items:center}

<script>
/* ============ ISI DUA NILAI INI DARI DASHBOARD SUPABASE ============ */
const SUPABASE_URL='https://yngyyoqmftslhcuqmgrn.supabase.co';      // contoh: https://abcdxyz.supabase.co
const SUPABASE_KEY='sb_publishable_kz05d2dAOlpD-hQdcxnCHg_7QVMQm6L';  // Publishable key (sb_publishable_...) atau anon key
const SEND_EVERY_MS=110;                            // makin besar = makin hemat pesan (mis. 160)
/* =================================================================== */
// Adapter: menyediakan API "room" yang sama dengan di claude.ai, tapi lewat Supabase Realtime Broadcast.
// Dipasang hanya jika halaman TIDAK dibuka di dalam claude.ai.
(function(){
 if(window.claude&&window.claude.use)return;
 let sb=null;
 function client(){if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:20}}});return sb}
 const room={async join(name){
  const id=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  const mine={},table=new Map(),subs=new Set();let lastSend=0,timer=null,pend=false,hb=null,closed=false;
  const ch=client().channel('skate:'+name,{config:{broadcast:{self:false,ack:false}}});
  const notify=()=>{if(pend||closed)return;pend=true;setTimeout(()=>{pend=false;if(closed)return;const c={peers:api.peers(),joined:[],left:[],updated:[]};subs.forEach(f=>{try{f(c)}catch(e){}})},120)};
  ch.on('broadcast',{event:'st'},({payload})=>{if(!payload||!payload.id||payload.id===id||typeof payload.p!=='object')return;const now=Date.now(),cur=table.get(payload.id),js=JSON.stringify(payload.p);
   if(!cur||cur.js!==js){table.set(payload.id,{id:payload.id,st:Object.freeze(payload.p),js,upd:now,seen:now});notify()}else cur.seen=now});
  ch.on('broadcast',{event:'bye'},({payload})=>{if(payload&&table.delete(payload.id))notify()});
  const chatSubs=new Set();
  ch.on('broadcast',{event:'chat'},({payload})=>{if(!payload||typeof payload.n!=='string'||typeof payload.t!=='string')return;chatSubs.forEach(fn=>{try{fn(payload)}catch(e){}})});
  await new Promise((res,rej)=>{const t=setTimeout(()=>rej({code:'upstream_error'}),10000);ch.subscribe(st=>{if(st==='SUBSCRIBED'){clearTimeout(t);res()}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){clearTimeout(t);rej({code:'upstream_error'})}})});
  const send=()=>{lastSend=Date.now();timer=null;if(!closed)ch.send({type:'broadcast',event:'st',payload:{id,p:Object.assign({},mine)}})};
  hb=setInterval(()=>{send();const now=Date.now();let ch2=false;for(const [k,v] of table)if(now-v.seen>5000){table.delete(k);ch2=true}if(ch2)notify()},1000);
  const api={
   presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}
    const wait=SEND_EVERY_MS-(Date.now()-lastSend);if(wait<=0)send();else if(!timer)timer=setTimeout(send,wait);notify();return Promise.resolve()},
   peers(){const out=[{peer:id,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:Object.assign({},mine),updatedAt:Date.now()}];
    for(const v of table.values())out.push({peer:v.id,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:v.st,updatedAt:v.upd});return out},
   onPeers(fn){subs.add(fn);return()=>subs.delete(fn)},
   sendChat(payload){if(closed)return Promise.resolve();return ch.send({type:'broadcast',event:'chat',payload:{n:String(payload.n||'Pemain').slice(0,16),t:String(payload.t||'').slice(0,180),at:Date.now()}})},

function sha256(s){const b=new TextEncoder().encode(s),l=b.length,n=((l+8)>>6)+1,w=new Uint32Array(n*16);for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i%4)*8);w[l>>2]|=0x80<<(24-(l%4)*8);w[n*16-1]=l*8;
 const h=SH.slice(),x=new Uint32Array(64),R=(v,k)=>(v>>>k)|(v<<(32-k));
 for(let o=0;o<n*16;o+=16){for(let i=0;i<16;i++)x[i]=w[o+i];for(let i=16;i<64;i++){const a=x[i-15],c=x[i-2];x[i]=(x[i-16]+(R(a,7)^R(a,18)^(a>>>3))+x[i-7]+(R(c,17)^R(c,19)^(c>>>10)))>>>0}
  let a=h[0],b2=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
  for(let i=0;i<64;i++){const t1=(hh+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+SK[i]+x[i])>>>0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c)^(b2&c)))>>>0;hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
  h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b2)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0}
 return h.map(v=>v.toString(16).padStart(8,'0')).join('')}
const passHash=(name,pw)=>sha256('skate1|'+name.toLowerCase()+'|'+pw);

let sbApi=null;
function api(){if(!sbApi&&window.supabase&&!/^GANTI_/.test(SUPABASE_URL)&&!/^GANTI_/.test(SUPABASE_KEY))sbApi=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});return sbApi}
async function rpc(fn,args){const c=api();if(!c)return{ok:false,err:'nosb'};
 try{const{data,error}=await c.rpc(fn,args);if(error){const m=String(error.message||'');if(error.code==='PGRST202'||error.code==='42883'||/could not find the function|schema cache/i.test(m))return{ok:false,err:'nosetup'};return{ok:false,err:'net'}}return data||{ok:false,err:'net'}}catch(e){return{ok:false,err:'net'}}}
function errText(r,name){const e=r&&r.err;
 if(e==='taken')return 'Nama akun "'+name+'" sudah digunakan. Pilih nama lain.';
 if(e==='badpass')return 'Password salah.';
 if(e==='notfound')return 'Nama akun tidak ditemukan. Daftar dulu di tab DAFTAR.';
 if(e==='invalid')return 'Nama 2–16 karakter (huruf, angka, spasi, _ . -) dan password minimal 4 karakter.';
 if(e==='nosetup')return 'Database akun belum disiapkan. Jalankan supabase_setup.sql di Supabase (SQL Editor).';
 if(e==='nosb')return 'Server belum terhubung. Periksa SUPABASE_URL & SUPABASE_KEY dan koneksi internet.';
 if(e==='toolarge')return 'Foto terlalu besar.';
 return 'Gagal terhubung ke server. Coba lagi.'}

function safeAv(a){a=String(a||'');if(a.length<20000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(a))return a;if(a.startsWith('e:')&&[...a.slice(2)].length>0&&[...a.slice(2)].length<=3)return a;return ''}

function testMediaBytes(data){return Math.floor((data.length-(data.indexOf(',')+1))*3/4)}
async function compressTestimonialMedia(file){
 const MAX_GIF=150*1024,MAX_IMAGE=160*1024,MAX_SIDE=420;
 if(file.type==='image/gif'){
  if(file.size>MAX_GIF)throw new Error('GIF terlalu besar. Pilih GIF maksimal 150 KB agar animasinya tetap utuh.');
  return await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(String(rd.result));rd.onerror=()=>reject(new Error('Gagal membaca GIF.'));rd.readAsDataURL(file)});
 }
 if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('Format yang didukung: PNG, JPG, WEBP, atau GIF.');
 const data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(new Error('Gagal membaca gambar.'));rd.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Gambar tidak bisa dibuka.'));im.src=data});
 let scale=Math.min(1,MAX_SIDE/Math.max(img.naturalWidth,img.naturalHeight)),out='';
 const preserveAlpha=file.type==='image/png';
 for(let attempt=0;attempt<8;attempt++){
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
  // PNG remains PNG so transparent pixels stay transparent; JPEG/WEBP are recompressed as JPEG.
  out=preserveAlpha?canvas.toDataURL('image/png'):canvas.toDataURL('image/jpeg',.68);
  if(testMediaBytes(out)<=MAX_IMAGE)return out;
  scale*=.78;
 }
 throw new Error(preserveAlpha?'PNG masih terlalu besar setelah kompresi. Pilih gambar yang lebih sederhana.':'Gambar masih terlalu besar setelah kompresi. Pilih gambar lain.');
}

function hostStart(){
 if(!olRoom||!iAmHost()||!olMeta)return;const ps=olViewers(),max=OL_MAX[olMeta.rc];
 const humans=ps.filter(p=>p.sameTab||(p.presence.rd===true&&p.presence.ph==='lobby')).slice(0,max),total=olMeta.fill!==false?max:humans.length;if(total<2)return;

function olGrid(n,rc,baseS){
 if(rc==='elim'){const lanes=[-53.75,-32.25,-10.75,10.75,32.25,53.75];return Array.from({length:n},(_,i)=>({s:baseS-Math.floor(i/6)*34,d:lanes[i%6],row:Math.floor(i/6)+1}))}

function startOnlineRace(go){
 cfg.race=go.rc;const me=myPeer(),hostNow=iAmHost();
 const blueStart=TRACK.straight+TRACK.arc+TRACK.straight*0.65,yellowStart=blueStart-TRACK.perimeter/2;

 const mk=(i,name,extra)=>Object.assign({id:i,name,color:COLORS[i%COLORS.length],s:grid[i].s,d:grid[i].d,v:0,top:MAX_SPEED,alive:true,finished:false,fall:0,fallTime:0,imm:0,crashCooldown:0,phase:Math.random()*6,ai:false,row:grid[i].row,finishTime:null,eliminatedAt:null,skill:1,stamina:1},extra);

function applyRemote(r,s,d,v,f,upd,dt){const age=Math.min(.35,Math.max(0,(Date.now()-upd)/1000)),ts=s+(f?0:v*age),k=Math.min(1,12*dt);r.s+=(ts-r.s)*k;r.d+=(d-r.d)*k;r.v=v;r.fall=f?1:0;r.phase+=v*dt*.055}

function syncRemotes(dt){

function markOnlineRaceInvalid(reason){
 if(olInvalidRace)return;

function checkOnlineRaceValidity(){
 if(!online||!olRoom||!racers.length||olInvalidRace)return;
 const peers=olRoom.peers();
 // A validity flag from any participant invalidates the entire shared race.
 if(peers.some(pe=>pe.presence&&pe.presence.iv===1)){markOnlineRaceInvalid('Peserta menandai lomba tidak sah.');return}
 const humans=racers.filter(r=>!r.bot);
 if(humans.length<2)return;
 const progress=r=>Math.max(0,(r.s-(r._validStartS??r.s))*LAP_METERS/TRACK.perimeter);
 const moving=humans.filter(r=>r.alive&&!r.finished);
 if(!moving.length)return;
 const furthest=Math.max(...humans.map(progress));
 if(furthest<LAP_METERS)return;
 for(const r of moving){
  // Ignore stale remote presence briefly so temporary network lag is not treated as cheating.
  if(r.remote){
   const pe=peers.find(x=>x.peer===r.peer);
   if(!pe||Date.now()-(pe.updatedAt||0)>4500)continue;
  }
  if(progress(r)<5){markOnlineRaceInvalid('Ada peserta manusia yang tidak bergerak selama satu putaran.');return}
 }
}

 if(html!==olLastHTML){olLastHTML=html;olDialog(html,true);bind('olLobby',backToLobby);bind('olExit',()=>roomListScreen())}}
