<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14122b">
<title>Admin Pesanan | Divalicious Studio</title>
<style>
:root{--bg:#f4f5f8;--ink:#17171c;--muted:#707080;--line:#e6e6ed;--acc:#7c5cff;--navy:#14122b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:1.5px}.brand span{color:#b6a5ff}.top small{display:block;opacity:.6;font-size:11px;letter-spacing:1px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px 40px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 6px 20px #17171c08}
.login{max-width:410px;margin:8vh auto}.login h1{margin:0 0 5px;font-size:22px}.muted{color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800}
input,select,textarea{border:1px solid #d9d9e3;border-radius:10px;padding:10px 12px;width:100%;background:#fff}textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;background:#181820;color:#fff;text-decoration:none;display:inline-block;font-size:13px}.btn.acc{background:var(--acc)}.btn.light{background:#f0f0f5;color:#292936}.btn.danger{background:#fde8e8;color:#b42318}.btn.wa{background:#e7f8ef;color:#087e55}
.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.stat span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.stat strong{display:block;font-size:24px;margin-top:2px}
.toolbar{display:grid;grid-template-columns:1fr 170px auto;gap:9px;margin-bottom:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}.card-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.card h3{margin:0;font-size:16px}.sub{font-size:12px;color:var(--muted)}
.tag{display:inline-block;background:#efeaff;color:#4b36b8;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800}.tag.new{background:#fff1d6;color:#8a5a00}
pre{white-space:pre-wrap;font:13px/1.5 inherit;background:#f8f8fb;border-radius:10px;padding:10px 12px;margin:10px 0;max-height:260px;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.row select{width:auto}.total{font-weight:900;font-size:17px}.file-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.file-meta{font-size:12px;color:var(--muted);flex:1;min-width:150px}.file-input{display:none}
.s-pending{background:#fff1d6}.s-produksi{background:#dfeaff}.s-selesai{background:#dff6e8}
.modal{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px}.dialog{background:#fff;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:20px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#181820;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:20}
.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}
</style>
</head>
<body>
<div class="top"><div><div class="brand">DIVALICIOUS <span>STUDIO</span></div><small>ORDER MANAGEMENT</small></div><div id="topActions" class="hidden"><button id="logoutBtn" class="btn light" type="button">Keluar</button></div></div>
<main class="wrap">
<section id="loginPanel" class="panel login"><h1>Login Admin</h1><p class="muted">Masukkan password untuk melihat pesanan Divalicious Studio.</p><form id="loginForm"><div class="field"><label>Password admin</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn acc" style="width:100%">Masuk</button><p id="loginErr" class="muted" style="color:#b42318"></p></form></section>
<section id="dashboard" class="hidden">
<div class="stats" id="stats"></div>
<section class="panel">
<div class="toolbar"><input id="search" placeholder="Cari nama, no. HP, alamat, isi pesanan…"><select id="statusFilter"><option value="">Semua status</option><option>Pending</option><option>Produksi</option><option>Selesai</option></select><button id="reload" class="btn light" type="button">↻ Muat ulang</button></div>
<div id="list"></div>
</section>
</section>
</main>
<div id="modal" class="modal hidden"><div class="dialog" id="dialog"></div></div>
<div id="toast" class="hidden"></div>
<script type="module">
import { unlock } from "../../form/orders-db.js?v=11";
const $=id=>document.getElementById(id);
const statuses=['Pending','Produksi','Selesai'];
let store=null,orders=[],tt;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const fdate=d=>new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const toast=m=>{$('toast').textContent=m;$('toast').classList.remove('hidden');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.add('hidden'),2600)};
const waLink=p=>{let n=String(p||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n=''+'62'+n;return n.length>=9?'https://wa.me/'+n:null};
const stat=s=>statuses.includes(s)?s:'Pending';
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginErr').textContent='';
  try{store=await unlock($('password').value);$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('topActions').classList.remove('hidden');await load()}
  catch(err){$('loginErr').textContent=err.message||'Gagal masuk'}});
$('logoutBtn').addEventListener('click',()=>location.reload());
$('reload').addEventListener('click',load);
$('search').addEventListener('input',render);$('statusFilter').addEventListener('change',render);
async function load(){$('list').innerHTML='<div class="empty">Memuat pesanan…</div>';
  try{orders=(await store.dsList()).map(o=>({...o,status:stat(o.status)}));render()}
  catch(e){$('list').innerHTML='<div class="empty">Gagal memuat: '+esc(e.message||e)+'</div>'}}
function render(){
  const c=statuses.map(s=>orders.filter(o=>o.status===s).length);
  const done=orders.filter(o=>o.status==='Selesai').reduce((a,o)=>a+Number(o.total||0),0);
  $('stats').innerHTML=[['Total pesanan',orders.length],['Pending',c[0]],['Produksi',c[1]],['Selesai · '+money(done),c[2]]].map(x=>'<div class="stat"><span>'+esc(x[0])+'</span><strong>'+x[1]+'</strong></div>').join('');
  const q=$('search').value.trim().toLowerCase(),sf=$('statusFilter').value;
  const list=orders.filter(o=>(!sf||o.status===sf)&&(!q||[o.customer_name,o.customer_phone,o.shipping_address,o.size_details,o.product].join(' ').toLowerCase().includes(q)));
  $('list').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Belum ada pesanan.</div>';
}
function card(o){
  const wa=waLink(o.customer_phone);
  return '<div class="card" data-id="'+o.id+'"><div class="card-h"><div><h3>#'+o.order_number+' · '+esc(o.customer_name)+'</h3><div class="sub">'+fdate(o.created_at)+' · <span class="tag">'+esc(o.product||'-')+'</span> '+(o.status==='Pending'?'<span class="tag new">baru</span>':'')+'</div></div><div class="total">'+money(o.total)+'</div></div>'
  +'<pre>'+esc(o.size_details)+'</pre>'
  +'<div class="sub">📞 '+esc(o.customer_phone)+'<br>📍 '+esc(o.shipping_address)+'</div>'
  +(o.note?'<div class="sub" style="margin-top:6px">📝 '+esc(o.note)+'</div>':'')
  +'<div class="row"><select class="s-'+o.status.toLowerCase()+'" data-st="'+o.id+'">'+statuses.map(s=>'<option'+(s===o.status?' selected':'')+'>'+s+'</option>').join('')+'</select>'
  +(o.file&&o.file.chunks?'<button class="btn acc" data-dl="'+o.id+'">⬇ 3MF ('+(o.file.size/1048576).toFixed(1)+' MB)</button>':'<span class="sub">'+(o.file?.error?'⚠ 3MF gagal diunggah':'Tanpa file 3MF')+'</span>')
  +(wa?'<a class="btn wa" target="_blank" rel="noopener" href="'+wa+'">WhatsApp</a>':'')
  +'<button class="btn light" data-file="'+o.id+'">Kelola file</button><button class="btn light" data-edit="'+o.id+'">Catatan</button></div></div>';
}
$('list').addEventListener('change',async e=>{const id=e.target.dataset.st;if(!id)return;const o=orders.find(x=>x.id===id);try{await store.setStatus(id,e.target.value);o.status=e.target.value;toast('Status disimpan');render()}catch(err){toast('Gagal: '+(err.message||err));render()}});
$('list').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.dl){const o=orders.find(x=>x.id===b.dataset.dl);const t=b.textContent;b.disabled=true;b.textContent='Mengunduh…';
    try{const blob=await store.dsFile(o.id,o.file);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.file.name||'pesanan.3mf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
    catch(err){toast('Gagal unduh: '+(err.message||err))}b.disabled=false;b.textContent=t}
  if(b.dataset.edit)openEdit(b.dataset.edit);if(b.dataset.file)openFileManager(b.dataset.file)});
function openFileManager(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const {id:_id,status:_status,images:_images,created_at:_created,order_number:_number,...orderData}=o;
  $('dialog').innerHTML='<h2 style="margin:0 0 4px">Kelola file order #'+o.order_number+'</h2><div class="sub">'+esc(o.customer_name)+'</div>'
    +'<div class="card" style="margin:14px 0"><strong>File saat ini</strong><div class="sub" style="margin-top:5px">'+(o.file&&o.file.chunks?esc(o.file.name)+' · '+(o.file.size/1048576).toFixed(2)+' MB':'Belum ada file 3MF')+'</div></div>'
    +'<div class="field"><label>'+(o.file&&o.file.chunks?'Pilih file pengganti (.3mf)':'Upload file (.3mf)')+'</label><input id="fileIn" type="file" accept=".3mf,application/vnd.ms-package.3dmanufacturing-3dmodel+zip"></div>'
    +'<div class="sub">Maksimal 50 MB. File baru akan menggantikan lampiran lama pada order ini.</div>'
    +'<div class="row" style="justify-content:flex-end;margin-top:18px">'+(o.file&&o.file.chunks?'<button id="removeFileBtn" class="btn danger" style="margin-right:auto">Hapus file saja</button>':'')+'<button id="fileCancel" class="btn light">Batal</button><button id="fileSave" class="btn acc">Simpan file</button></div>';
  $('modal').classList.remove('hidden');
  $('fileCancel').onclick=()=>$('modal').classList.add('hidden');
  $('fileSave').onclick=async()=>{
    const f=$('fileIn').files[0];if(!f){toast('Pilih file 3MF terlebih dahulu');return}
    if(!/\.3mf$/i.test(f.name)){toast('Format harus .3mf');return}
    if(f.size>50*1024*1024){toast('Ukuran file maksimal 50 MB');return}
    const btn=$('fileSave');btn.disabled=true;btn.textContent='Mengunggah…';
    try{const bytes=new Uint8Array(await f.arrayBuffer());const meta=await store.dsReplaceFile(o.id,orderData,o.file,bytes,f.name);o.file=meta;o.app='ds';$('modal').classList.add('hidden');render();toast('File order berhasil diperbarui')}
    catch(err){toast('Gagal menyimpan: '+(err.message||err));btn.disabled=false;btn.textContent='Simpan file'}
  };
  const remove=$('removeFileBtn');if(remove)remove.onclick=async()=>{
    if(!confirm('Hapus lampiran 3MF saja? Data dan detail order tetap tersimpan.'))return;
    remove.disabled=true;remove.textContent='Menghapus…';
    try{const next=await store.dsDeleteFile(o.id,orderData,o.file);delete o.file;Object.assign(o,next);$('modal').classList.add('hidden');render();toast('File dihapus, order tetap tersimpan')}
    catch(err){toast('Gagal menghapus: '+(err.message||err));remove.disabled=false;remove.textContent='Hapus file saja'}
  };
}
function openEdit(id){const o=orders.find(x=>x.id===id);
  $('dialog').innerHTML='<h2 style="margin:0 0 4px">#'+o.order_number+' · '+esc(o.customer_name)+'</h2><div class="sub">'+fdate(o.created_at)+'</div><div class="field"><label>Catatan admin</label><textarea id="noteIn" placeholder="Catatan produksi, pembayaran, dll.">'+esc(o.note||'')+'</textarea></div><div class="row" style="justify-content:flex-end"><button id="delBtn" class="btn danger" style="margin-right:auto">Hapus</button><button id="cancelBtn" class="btn light">Batal</button><button id="saveBtn" class="btn acc">Simpan</button></div>';
  $('modal').classList.remove('hidden');
  $('cancelBtn').onclick=()=>$('modal').classList.add('hidden');
  $('saveBtn').onclick=async()=>{const {id:_i,status,images,created_at,order_number,...data}=o;data.note=$('noteIn').value.trim();try{await store.save(o.id,o.status,data);o.note=data.note;$('modal').classList.add('hidden');render();toast('Tersimpan')}catch(err){toast('Gagal: '+(err.message||err))}};
  $('delBtn').onclick=async()=>{if(!confirm('Hapus pesanan ini beserta file 3MF-nya?'))return;try{await store.dsRemove(o.id,o.file);orders=orders.filter(x=>x.id!==o.id);$('modal').classList.add('hidden');render();toast('Dihapus')}catch(err){toast('Gagal: '+(err.message||err))}};
}
</script>
</body></html>
