<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Pesanan | D.VA SKATE</title>
<style>
:root{--bg:#0d0d10;--panel:#17171c;--line:#34343d;--ink:#f7f7fa;--muted:#a6a6b2;--pink:#f06aa5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#49223b 0,transparent 38%),var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px 15px 50px}.brand{font-size:22px;font-weight:950;letter-spacing:2px}.brand span{color:var(--pink)}.muted{color:var(--muted);font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:15px}.login{max-width:420px;margin:9vh auto}label{display:block;font-size:12px;margin:12px 0 6px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #444450;background:#101014;color:white;font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(100deg,#ed5f9c,#ff8ab8);color:#260e1a;font-weight:850;cursor:pointer}.secondary{background:#30303a;color:white}.hidden{display:none!important}.error{color:#ff9e9e;font-size:12px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#202027;border-radius:12px;padding:13px}.stat strong{display:block;font-size:25px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.toolbar input{flex:1;min-width:180px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#f6a9ca;font-size:11px}td small{display:block;color:var(--muted)}.status{font-size:11px;padding:5px 8px;border-radius:20px;background:#39313a}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:11px}.detail{white-space:pre-wrap;overflow-wrap:anywhere}.empty{text-align:center;color:var(--muted);padding:25px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}}
</style></head><body><main class="wrap">
<section id="loginPanel" class="panel login"><div class="brand">D.VA <span>SKATE</span></div><h2>Admin Pesanan</h2><p class="muted">Login dengan akun admin Supabase.</p><form id="loginForm"><label>Email admin</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button style="width:100%;margin-top:16px">LOGIN ADMIN</button><div id="loginError" class="error"></div></form></section>
<section id="dashboard" class="hidden"><header><div><div class="brand">D.VA <span>SKATE</span></div><div class="muted">DASHBOARD ADMIN PESANAN</div></div><div><button id="refresh" class="secondary">Muat ulang</button> <button id="logout" class="secondary">Keluar</button></div></header>
<div class="stats"><div class="stat">Total<strong id="total">0</strong></div><div class="stat">Baru<strong id="new">0</strong></div><div class="stat">Diproses<strong id="process">0</strong></div><div class="stat">Dikirim<strong id="sent">0</strong></div></div>
<section class="panel"><h2>Daftar Pesanan</h2><div class="toolbar"><input id="search" placeholder="Cari nama, HP, atau ID"><select id="filter"><option value="">Semua status</option><option>Baru</option><option>Menunggu DP</option><option>Sudah DP</option><option>Produksi</option><option>Selesai</option><option>Dikirim</option></select><button id="csv" class="secondary">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>ID</th><th>Nama</th><th>WhatsApp</th><th>Ukuran / Atlet</th><th>Alamat</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div><div id="dashError" class="error"></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const configured=window.DVA_SUPABASE_URL&&window.DVA_SUPABASE_ANON_KEY&&!window.DVA_SUPABASE_URL.includes("ISI");const db=configured?window.supabase.createClient(window.DVA_SUPABASE_URL,window.DVA_SUPABASE_ANON_KEY):null;const $=id=>document.getElementById(id);let orders=[];const statuses=["Baru","Menunggu DP","Sudah DP","Produksi","Selesai","Dikirim"];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){if(!db)return;const r=await db.from("orders").select("*").order("created_at",{ascending:false}).limit(1000);if(r.error){$("dashError").textContent=r.error.message;return}orders=r.data||[];render()}
function render(){const q=$("search").value.toLowerCase(),s=$("filter").value;const shown=orders.filter(o=>(!s||o.status===s)&&[o.id,o.customer_name,o.phone,o.size_details].join(" ").toLowerCase().includes(q));$("total").textContent=orders.length;$("new").textContent=orders.filter(o=>o.status==="Baru").length;$("process").textContent=orders.filter(o=>["Menunggu DP","Sudah DP","Produksi","Selesai"].includes(o.status)).length;$("sent").textContent=orders.filter(o=>o.status==="Dikirim").length;$("rows").innerHTML=shown.length?shown.map(o=>'<tr><td>'+new Date(o.created_at).toLocaleString("id-ID")+'</td><td>#'+esc(o.id)+'</td><td>'+esc(o.customer_name)+'</td><td>'+esc(o.phone)+'</td><td><div class="detail">'+esc(o.size_details)+'</div></td><td><div class="detail">'+esc(o.shipping_address)+'</div></td><td><span class="status">'+esc(o.status)+'</span></td><td><div class="actions"><button class="secondary" onclick="changeStatus('+Number(o.id)+')">Status</button><button class="secondary" onclick="copyDetails('+Number(o.id)+')">Salin</button></div></td></tr>').join(""):'<tr><td colspan="8" class="empty">Belum ada pesanan.</td></tr>'}
window.changeStatus=async id=>{const o=orders.find(x=>Number(x.id)===id);const s=prompt("Pilih status: "+statuses.join(", "),o.status);if(!s)return;if(!statuses.includes(s)){alert("Status tidak valid");return}const r=await db.from("orders").update({status:s,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else load()};
window.copyDetails=id=>{const o=orders.find(x=>Number(x.id)===id);const t="Pesanan #"+o.id+"\nNama: "+o.customer_name+"\nHP: "+o.phone+"\nUkuran: "+o.size_details+"\nAlamat: "+o.shipping_address+"\nStatus: "+o.status;navigator.clipboard.writeText(t).then(()=>alert("Detail disalin"))};
$("loginForm").onsubmit=async e=>{e.preventDefault();if(!db){$("loginError").textContent="Isi konfigurasi Supabase pada supabase-config.js";return}const r=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(r.error){$("loginError").textContent=r.error.message;return}init()};
async function init(){if(!db)return;const r=await db.auth.getSession();const ok=!!r.data.session;$("loginPanel").classList.toggle("hidden",ok);$("dashboard").classList.toggle("hidden",!ok);if(ok)load()}
$("logout").onclick=async()=>{await db.auth.signOut();init()};$("refresh").onclick=load;$("search").oninput=render;$("filter").onchange=render;
$("csv").onclick=()=>{const cols=["id","created_at","customer_name","phone","size_details","shipping_address","status"];const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';const csv=[cols.join(","),...orders.map(o=>cols.map(k=>q(o[k])).join(","))].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="rekap-pesanan-dva-skate.csv";a.click();URL.revokeObjectURL(a.href)};init();
</script></body></html>
