<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014">
<title>Admin Pesanan | D.VA SKATE</title>
<style>
:root{--bg:#f4f5f8;--ink:#17171c;--muted:#707080;--line:#e6e6ed;--pink:#ed6aa5;--navy:#191923;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{background:#111116;color:#fff;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:950;letter-spacing:2px}.brand span{color:#f17bad}.top small{display:block;color:#aaa;font-size:10px;letter-spacing:2px}.wrap{max-width:1180px;margin:auto;padding:22px 16px 50px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 6px 20px #17171c08}
.login{max-width:410px;margin:8vh auto}.login h1{margin:0 0 5px;font-size:22px}.muted{color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:11px 12px;border:1px solid #dcdce5;border-radius:10px;background:#fff;color:#17171c;min-width:0}.field textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;background:#181820;color:#fff}.btn.pink{background:var(--pink);color:#2a1020}.btn.light{background:#f0f0f5;color:#292936}.btn.danger{background:#fff0f3;color:#b42345}.btn:disabled{opacity:.55;cursor:wait}
.hidden{display:none!important}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.heading h1{font-size:23px;margin:0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.stat span{display:block;color:var(--muted);font-size:11px;font-weight:700}.stat strong{display:block;font-size:24px;margin-top:3px}
.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 190px 150px auto;gap:9px;margin-bottom:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{font-size:11px;color:#777783;text-transform:uppercase;letter-spacing:.5px}td b{display:block}.sub{font-size:11px;color:var(--muted);margin-top:3px}.status{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:850;background:#f0f0f5}.s-baru{background:#e9f0ff;color:#2452a5}.s-menunggu-dp{background:#fff5db;color:#946200}.s-sudah-dp{background:#e7f8ef;color:#087e55}.s-produksi{background:#f3eaff;color:#7041a6}.s-selesai{background:#e4f6f5;color:#087b78}.s-dikirim{background:#e8f1ff;color:#2253a1}
.empty{text-align:center;color:var(--muted);padding:35px}.row-actions{display:flex;gap:6px}.row-actions .btn{padding:7px 10px;font-size:11px}
.modal{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px}.dialog{background:#fff;width:min(600px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:20px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.notice{padding:10px 12px;border-radius:10px;background:#fff5db;color:#775500;font-size:12px;margin:12px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17171c;color:#fff;padding:11px 16px;border-radius:10px;z-index:20;font-size:13px;box-shadow:0 8px 25px #0003}
@media(max-width:800px){.stats{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.heading{align-items:flex-start}.heading h1{font-size:20px}}
@media(max-width:480px){.top{padding:14px}.wrap{padding:15px 10px 35px}.stats{grid-template-columns:repeat(2,1fr)}.stat strong{font-size:21px}.panel{padding:13px}.grid{grid-template-columns:1fr}.dialog{padding:15px}.heading{flex-direction:column}.heading .btn{width:100%}}
</style>
</head>
<body>
<div class="top"><div><div class="brand">D.VA <span>SKATE</span></div><small>ORDER MANAGEMENT</small></div><div id="topActions" class="hidden"><button id="logoutBtn" class="btn light" type="button">Keluar</button></div></div>
<main class="wrap">
<section id="loginPanel" class="panel login"><h1>Login Admin</h1><p class="muted">Masuk untuk mengelola pesanan D.VA SKATE.</p><form id="loginForm"><div class="field"><label>Email admin</label><input id="email" type="email" autocomplete="username" required placeholder="admin@email.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Password"></div><button id="loginBtn" class="btn pink" style="width:100%;margin-top:8px">MASUK</button><div id="loginError" class="notice hidden"></div></form></section>
<section id="dashboard" class="hidden">
<div class="heading"><div><h1>Pesanan Masuk</h1><div class="muted">Kelola status dan detail order pelanggan.</div></div><button id="refreshBtn" class="btn light" type="button">↻ Refresh</button></div>
<div class="stats" id="stats"></div>
<section class="panel">
<div class="toolbar"><input id="search" placeholder="Cari nama, no. HP, ukuran, alamat…"><select id="statusFilter"><option value="">Semua status</option><option>Baru</option><option>Menunggu DP</option><option>Sudah DP</option><option>Produksi</option><option>Selesai</option><option>Dikirim</option></select><select id="sortFilter"><option value="new">Terbaru</option><option value="old">Terlama</option></select><button id="exportBtn" class="btn light" type="button">Export CSV</button></div>
<div class="table-wrap"><table><thead><tr><th>No. Order</th><th>Pelanggan</th><th>Ukuran</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="ordersBody"><tr><td colspan="6" class="empty">Memuat pesanan…</td></tr></tbody></table></div>
</section></section>
</main>
<div id="editModal" class="modal hidden"><div class="dialog"><div class="dialog-head"><h2>Edit Pesanan</h2><button id="closeModal" class="btn light" type="button">✕</button></div><form id="editForm"><input id="editId" type="hidden"><div class="grid">
<div class="field"><label>Nama pelanggan</label><input id="editName" required></div><div class="field"><label>No. HP / WhatsApp</label><input id="editPhone" required></div>
<div class="field"><label>Status pesanan</label><select id="editStatus"><option>Baru</option><option>Menunggu DP</option><option>Sudah DP</option><option>Produksi</option><option>Selesai</option><option>Dikirim</option></select></div>
<div class="field"><label>Total tagihan (Rp)</label><input id="editTotal" type="number" min="0" step="1000"></div>
<div class="field"><label>DP diterima (Rp)</label><input id="editDP" type="number" min="0" step="1000"></div><div class="field"><label>Ongkir (Rp)</label><input id="editShipping" type="number" min="0" step="1000"></div>
<div class="field" style="grid-column:1/-1"><label>Ukuran / detail pesanan</label><textarea id="editSizes" required></textarea></div>
<div class="field" style="grid-column:1/-1"><label>Alamat pengiriman</label><textarea id="editAddress" required></textarea></div>
<div class="field" style="grid-column:1/-1"><label>Catatan admin</label><textarea id="editNote" placeholder="Catatan produksi, pembayaran, dll."></textarea></div>
</div><div class="dialog-actions"><button id="cancelEdit" class="btn light" type="button">Batal</button><button id="saveEdit" class="btn pink" type="submit">Simpan perubahan</button></div></form></div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../form/supabase-config.js"></script>
<script>
const cfg=window.DVA_SUPABASE_CONFIG||{};
const ready=cfg.url&&cfg.anonKey&&!cfg.url.includes('PROJECT-REF')&&!cfg.anonKey.includes('SUPABASE_ANON');
const db=ready?window.supabase.createClient(cfg.url,cfg.anonKey):null;
const statuses=['Baru','Menunggu DP','Sudah DP','Produksi','Selesai','Dikirim'];
let orders=[],toastTimer;
const $=id=>document.getElementById(id);
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function money(n){return n==null||n===''?'—':'Rp'+Number(n).toLocaleString('id-ID')}
function date(v){return new Date(v).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}
function slug(s){return s.toLowerCase().replaceAll(' ','-')}
function showLogin(){ $('loginPanel').classList.remove('hidden');$('dashboard').classList.add('hidden');$('topActions').classList.add('hidden') }
function showDashboard(){ $('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('topActions').classList.remove('hidden') }
async function loadOrders(){if(!db)return;const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(1000);if(error){toast('Gagal memuat: '+error.message);return}orders=data||[];render()}
function renderStats(){const counts=statuses.map(s=>orders.filter(o=>o.status===s).length);$('stats').innerHTML=[['Total',orders.length],...statuses.map((s,i)=>[s,counts[i]])].map(([name,count])=>'<div class="stat"><span>'+name+'</span><strong>'+count+'</strong></div>').join('')}
function render(){renderStats();let list=[...orders];const q=$('search').value.trim().toLowerCase(),st=$('statusFilter').value;if(q)list=list.filter(o=>[o.order_number,o.customer_name,o.customer_phone,o.size_details,o.shipping_address].join(' ').toLowerCase().includes(q));if(st)list=list.filter(o=>o.status===st);if($('sortFilter').value==='old')list.reverse();$('ordersBody').innerHTML=list.length?list.map(o=>'<tr><td><b>#'+o.order_number+'</b><div class="sub">'+o.id.slice(0,8)+'</div></td><td><b>'+esc(o.customer_name)+'</b><div class="sub">'+esc(o.customer_phone)+'</div></td><td>'+esc(o.size_details).replaceAll('\n','<br>')+'</td><td>'+date(o.created_at)+'</td><td><span class="status s-'+slug(o.status)+'">'+esc(o.status)+'</span></td><td><div class="row-actions"><button class="btn light" data-edit="'+o.id+'">Edit</button></div></td></tr>').join(''):'<tr><td colspan="6" class="empty">Belum ada pesanan yang cocok.</td></tr>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openEdit(id){const o=orders.find(x=>x.id===id);if(!o)return;$('editId').value=o.id;$('editName').value=o.customer_name||'';$('editPhone').value=o.customer_phone||'';$('editStatus').value=o.status;$('editTotal').value=o.total_amount??'';$('editDP').value=o.dp_amount??'';$('editShipping').value=o.shipping_cost??'';$('editSizes').value=o.size_details||'';$('editAddress').value=o.shipping_address||'';$('editNote').value=o.admin_note||'';$('editModal').classList.remove('hidden')}
function closeEdit(){$('editModal').classList.add('hidden')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!db){$('loginError').textContent='Supabase belum dikonfigurasi. Isi URL dan anon key pada form/supabase-config.js.';$('loginError').classList.remove('hidden');return}$('loginBtn').disabled=true;const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('loginError').textContent=error.message;$('loginError').classList.remove('hidden');return}$('loginError').classList.add('hidden');showDashboard();await loadOrders()});
$('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();orders=[];showLogin()});
$('refreshBtn').addEventListener('click',loadOrders);['search','statusFilter','sortFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
$('ordersBody').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(b)openEdit(b.dataset.edit)});
['closeModal','cancelEdit'].forEach(id=>$(id).addEventListener('click',closeEdit));
$('editForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('editId').value;const payload={customer_name:$('editName').value.trim(),customer_phone:$('editPhone').value.trim(),status:$('editStatus').value,total_amount:$('editTotal').value===''?null:Number($('editTotal').value),dp_amount:$('editDP').value===''?null:Number($('editDP').value),shipping_cost:$('editShipping').value===''?null:Number($('editShipping').value),size_details:$('editSizes').value.trim(),shipping_address:$('editAddress').value.trim(),admin_note:$('editNote').value.trim()};$('saveEdit').disabled=true;const {error}=await db.from('orders').update(payload).eq('id',id);$('saveEdit').disabled=false;if(error){toast('Gagal menyimpan: '+error.message);return}closeEdit();toast('Pesanan berhasil diperbarui');await loadOrders()});
$('exportBtn').addEventListener('click',()=>{const head=['No Order','Tanggal','Nama','No HP','Ukuran','Alamat','Status','Total','DP','Ongkir','Catatan'];const rows=orders.map(o=>[o.order_number,o.created_at,o.customer_name,o.customer_phone,o.size_details,o.shipping_address,o.status,o.total_amount,o.dp_amount,o.shipping_cost,o.admin_note]);const csv=[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='rekap-pesanan-dva-skate.csv';a.click();URL.revokeObjectURL(a.href)});
(async()=>{if(!ready){$('loginError').textContent='Konfigurasi Supabase belum diisi. Tambahkan Project URL dan anon/public key pada form/supabase-config.js.';$('loginError').classList.remove('hidden');return}const {data}=await db.auth.getSession();if(data.session){showDashboard();await loadOrders()}else showLogin();db.auth.onAuthStateChange((_event,session)=>{if(!session)showLogin()})})();
</script>
</body></html>
