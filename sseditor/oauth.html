<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk Google Drive · Diva Skate Skinsuit</title>
<style>body{font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;margin:0;padding:20px;text-align:center;color:#222}
a{display:inline-block;margin-top:14px;padding:13px 24px;border-radius:24px;background:#e8661c;color:#fff;text-decoration:none;font-weight:600}small{color:#777;margin-top:12px;max-width:320px}</style></head>
<body><h3 id="t">Menghubungkan Google Drive…</h3><a id="go" href="#">Kembali ke aplikasi</a><small id="s">Kalau aplikasi tidak terbuka otomatis, ketuk tombol di atas.</small>
<script>
(function(){
  var h=new URLSearchParams((location.hash||'').replace(/^#/,'')),q=new URLSearchParams(location.search),p=new URLSearchParams();
  ['access_token','expires_in','state','error','scope'].forEach(function(k){var v=h.get(k)||q.get(k);if(v)p.set(k,v)});
  if(p.get('error'))document.getElementById('t').textContent='Login dibatalkan / gagal: '+p.get('error');
  else if(p.get('access_token'))document.getElementById('t').textContent='Berhasil masuk ✓';
  var url='intent://auth?'+p.toString()+'#Intent;scheme=divaskinsuit;package=com.fakecuan.divaskinsuit;end';
  document.getElementById('go').href=url;
  history.replaceState(null,'',location.pathname);
  setTimeout(function(){location.href=url},150);
})();
</script></body></html>
