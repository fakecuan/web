name: Padel APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-padel/**"
      - "android-update-check/**"
      - ".github/workflows/padel-apk.yml"

permissions:
  contents: write

concurrency:
  group: padel-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-padel
    env:
      KS_B64: ${{ secrets.PADEL_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.PADEL_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.PADEL_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-padel/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan proyek Android
        run: |
          npm ci
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
          node ../android-update-check/inject.mjs padel-apk-latest TheWinnerPadel.apk true
          VC=$(( 100 + ${{ github.run_number }} ))
          sed -i "s/versionCode 1$/versionCode $VC/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android-padel/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Tanda tangani APK
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > release.jks; KS=release.jks
          else
            KS=signing/the-winner-padel.jks; export KS_PASS='_vqwe0FzOrMMatNaUuQVMFiw'; KS_ALIAS=padel
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out TheWinnerPadel.apk aligned.apk
          "$BT/apksigner" verify TheWinnerPadel.apk
          rm -f release.jks

      - name: Unggah ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="padel-apk-latest"
          gh release delete "$TAG" -y --cleanup-tag || true
          git push origin ":refs/tags/$TAG" || true
          gh release create "$TAG" TheWinnerPadel.apk \
            --target "${{ github.sha }}" \
            --title "The Winner Padel APK 1.${{ github.run_number }}" \
            --notes "APK Android The Winner Padel. Aplikasi memuat https://fakecuan.github.io/web/padel/, jadi isinya ikut ter-update tanpa instal ulang. Pasang di atas versi sebelumnya untuk update. Link tetap: https://github.com/fakecuan/web/releases/download/padel-apk-latest/TheWinnerPadel.apk" \
            --latest=false
