name: Padel APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-padel/**"
      - ".github/workflows/padel-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-padel
    env:
      KS_B64: ${{ secrets.PADEL_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.PADEL_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.PADEL_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek kunci tanda tangan
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Secrets PADEL_KEYSTORE_BASE64, PADEL_KEYSTORE_PASSWORD dan PADEL_KEY_ALIAS belum diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-padel/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan proyek Android
        run: |
          npm ci
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
          VC=$(( 100 + ${{ github.run_number }} ))
          sed -i "s/versionCode 1$/versionCode $VC/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android-padel/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Tanda tangani APK
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out TheWinnerPadel.apk aligned.apk
          "$BT/apksigner" verify TheWinnerPadel.apk
          rm -f release.jks

      - name: Unggah ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="padel-apk-v1.${{ github.run_number }}"
          gh release create "$TAG" TheWinnerPadel.apk \
            --title "The Winner Padel APK 1.${{ github.run_number }}" \
            --notes "APK Android untuk The Winner Padel. Aplikasi memuat https://fakecuan.github.io/web/padel/, jadi isinya ikut ter-update tanpa instal ulang. Pasang di atas versi sebelumnya untuk update." \
            --latest
